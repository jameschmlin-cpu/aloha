Skill_Metadata:
  Name: "Voice_Trading_Command_System"
  Version: "1.0.0"
  Hardware_Source: "S24_Ultra_Voice_Node"
  Hash: "0xVOICE_COMMAND_READY"

Antigravity_Logic:
  # 意圖處理層
  Voice_Intent_Parser:
    Engine: "Local_LLM_Translation"
    Task: "將語音文字轉換為 JSON 指令"
    Examples:
      - Command: "台積電買進一張"
        Action: "BUY_SYMBOL_QTY"
        Params: {"Symbol": "2330", "Qty": 1}

