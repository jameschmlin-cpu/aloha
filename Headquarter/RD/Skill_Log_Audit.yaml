# ==============================================================================
# Skill ID: Skill_Log_Audit
# Status: CRITICAL_SAFETY_MODULE
# ==============================================================================

log_audit_manifest:
  name: "Auto_Logger_System"
  version: "2.0.0"
  path: "C:\Genesis\Headquarter\Logs\Empire_Audit.log"
  
  # 對接節點監控
  nodes_monitored:
    - "Node_A_Token_Flow"
    - "Node_C_Quality_Assert"
    - "Node_D_Execution_Result"
  
  # 稽核規範 (符合 Antigravity 2.0)
  audit_policy:
    trace_level: "VERBOSE"
    timestamp_sync: "UTC+8_TW"
    hash_validation: "ENABLED" # 每一筆 Log 必須附帶 Action_Hash
    
  # 異常處理機制
  on_error:
    trigger: "SYSTEM_FUSE_TRIP"
    action: "Generate_Root_Cause_Report"

orchestration:
  priority: "Highest" # 日誌模組優先級最高，嚴禁被中斷
  deployment_mode: "Persistent" # 常駐記憶體